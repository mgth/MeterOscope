<?xml version="1.0" encoding="UTF-8"?>
<!-- MeterOscope : icône d'application (source principale, 48 px et plus) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c94d4"/>
      <stop offset="1" stop-color="#0b6a9e"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2b3238"/>
      <stop offset="1" stop-color="#16191c"/>
    </radialGradient>
  </defs>
  <!-- tuile arrondie -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="30" y="30" width="452" height="452" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="12"/>
  <!-- règle graduée -->
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <line x1="112" y1="400" x2="112" y2="448"/>
    <line x1="160" y1="418" x2="160" y2="448"/>
    <line x1="208" y1="418" x2="208" y2="448"/>
    <line x1="256" y1="400" x2="256" y2="448"/>
    <line x1="304" y1="418" x2="304" y2="448"/>
    <line x1="352" y1="418" x2="352" y2="448"/>
    <line x1="400" y1="400" x2="400" y2="448"/>
  </g>
  <!-- oculaire -->
  <circle cx="256" cy="212" r="146" fill="url(#glass)" stroke="#ffffff" stroke-width="28"/>
  <!-- cote de mesure -->
  <g stroke="#ffd23f" stroke-linecap="round" fill="none">
    <line x1="176" y1="212" x2="336" y2="212" stroke-width="20"/>
    <line x1="170" y1="166" x2="170" y2="258" stroke-width="28"/>
    <line x1="342" y1="166" x2="342" y2="258" stroke-width="28"/>
  </g>
  <g fill="#ffd23f">
    <path d="M184 212 L222 186 L222 238 Z"/>
    <path d="M328 212 L290 186 L290 238 Z"/>
  </g>
</svg>
