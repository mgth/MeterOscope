name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p meteroscope
      - name: Paquet portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/MeterOscope | Out-Null
          Copy-Item target/release/meteroscope.exe dist/MeterOscope/MeterOscope.exe
          Copy-Item LICENSE, README.md dist/MeterOscope/
          Compress-Archive dist/MeterOscope dist/MeterOscope-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeterOscope-windows-x64
          path: dist/MeterOscope-windows-x64.zip
      - name: Publication (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MeterOscope-windows-x64.zip
