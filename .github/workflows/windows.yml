name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p meteroscope
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'meteroscope' | Select-Object -ExpandProperty version
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $v de Cargo.toml" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Paquet portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/MeterOscope | Out-Null
          Copy-Item target/release/meteroscope.exe dist/MeterOscope/MeterOscope.exe
          Copy-Item LICENSE, README.md dist/MeterOscope/
          Compress-Archive dist/MeterOscope dist/MeterOscope-${{ steps.version.outputs.version }}-portable-x64.zip
      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          $cands = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          Write-Host "ISCC : $iscc"
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\target\release" installer\meteroscope.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item installer/Output/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MeterOscope-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
      - name: Publication (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MeterOscope ${{ steps.version.outputs.version }}
          files: |
            dist/*.zip
            dist/*.exe
