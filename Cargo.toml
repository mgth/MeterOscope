[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mesura-core = { path = "crates/core" }
mesura-camera = { path = "crates/camera" }
mesura-io = { path = "crates/io" }
mesura-canvas = { path = "crates/canvas" }
mesura-panels = { path = "crates/panels" }
egui = "0.37"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rfd = "0.18"
nokhwa = { version = "0.10", features = ["input-native"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
