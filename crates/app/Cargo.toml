[package]
name = "meteroscope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
meteroscope-i18n.workspace = true
meteroscope-core.workspace = true
meteroscope-camera.workspace = true
meteroscope-io.workspace = true
meteroscope-canvas.workspace = true
meteroscope-panels.workspace = true
egui.workspace = true
eframe.workspace = true
image.workspace = true
rfd.workspace = true
anyhow.workspace = true
serde_json.workspace = true
dirs = "6"
# Lecture du presse-papiers (image, liste de fichiers) ; déjà tiré par egui-winit.
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }

# Formats du presse-papiers Windows (PNG ou bitmap) ; déjà tiré par arboard.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange"] }

# Ressources Windows (icône de l'exécutable, informations de version).
[build-dependencies]
winresource = "0.1.34"
